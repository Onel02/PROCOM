<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Finder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Music Finder</h1>
    <form id="search-form">
      <input id="search-input" type="search" placeholder="Search a song or artist" required>
      <button type="submit">Search</button>
    </form>
    <div id="recent" aria-label="Recent searches"></div>
  </header>

  <main>
    <p id="status" role="status"></p>

    <section>
      <h2>Results</h2>
      <ul id="results" class="track-list"></ul>
    </section>

    <section>
      <h2>Favorites</h2>
      <ul id="favorites" class="track-list"></ul>
    </section>
  </main>

  <audio id="player"></audio>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
