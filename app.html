<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leafwise: Explore and My garden</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/theme.js"></script>
</head>
<body>
<header class="top">
  <h1><a href="index.html">Leafwise</a></h1>
  <nav>
    <button data-view="explore" class="active">Explore</button>
    <button data-view="garden">My garden <span id="due-badge" hidden></span></button>
  </nav>
  <div class="row"><span id="user-email"></span>&nbsp;<button id="auth-btn" class="ghost">Sign in</button><button id="theme-btn" class="ghost" aria-label="Toggle dark mode"></button></div>
</header>

<main>
  <section id="view-explore">
    <form id="search-form" class="row">
      <input id="q" type="search" placeholder="Search a plant, e.g. monstera" required>
      <select id="light-filter" aria-label="Filter by light">
    <option value="">Any light</option>
    <option value="low">Low light</option>
    <option value="indirect">Indirect light</option>
    <option value="sun">Full sun</option>
    <option value="shade">Partial shade</option>
  </select>
  <button>Search</button>
    </form>
    <p id="explore-msg" class="msg"></p>
    <div id="results" class="grid"></div>
  </section>

  <section id="view-garden" hidden>
    <h2>My garden</h2>
    <p id="garden-msg" class="msg"></p>
    <div id="today" class="today" hidden>
      <h3>Needs water today</h3>
      <ul id="today-list"></ul>
    </div>
    <div id="garden" class="grid"></div>
  </section>
</main>

<dialog id="plant-dialog">
  <div id="plant-body" class="stack"></div>
  <form method="dialog"><button class="ghost">Close</button></form>
</dialog>

<dialog id="garden-dialog">
  <div id="garden-body" class="stack"></div>
  <form method="dialog"><button class="ghost">Close</button></form>
</dialog>

<div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
</body>
</html>
