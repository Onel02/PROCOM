<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leafwise: Explore and My garden</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <h1><a href="index.html">Leafwise</a></h1>
  <nav>
    <button data-view="explore" class="active">Explore</button>
    <button data-view="garden">My garden <span id="due-badge" hidden></span></button>
  </nav>
  <div class="row"><span id="user-email"></span>&nbsp;<button id="auth-btn">Sign in</button></div>
</header>

<main>
  <section id="view-explore">
    <form id="search-form" class="row">
      <input id="q" type="search" placeholder="Search a plant, e.g. monstera" required>
      <button>Search</button>
    </form>
    <p id="explore-msg" class="msg"></p>
    <div id="results" class="grid"></div>
  </section>

  <section id="view-garden" hidden>
    <div class="row"><h2>My garden</h2><button id="notif-btn" class="ghost">Enable reminders</button></div>
    <p id="garden-msg" class="msg"></p>
    <div id="garden" class="grid"></div>
  </section>
</main>

<dialog id="plant-dialog">
  <div id="plant-body" class="stack"></div>
  <form method="dialog"><button class="ghost">Close</button></form>
</dialog>

<div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
</body>
</html>
